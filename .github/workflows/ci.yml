name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: pip install ruff && ruff check ecg app scripts tests
      - name: Unit tests
        # test_api.py needs a trained model + the multi-GB PTB-XL dataset,
        # neither of which is available in CI, so it self-skips.
        # test_preprocessing.py and test_dataset.py use synthetic data and
        # run everywhere.
        run: pytest -v
